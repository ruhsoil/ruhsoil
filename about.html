<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  class Particle {
    constructor() { this.reset(true); }
    reset(init = false) {
      this.x = Math.random() * W;
      this.y = init ? Math.random() * H : H + 10;
      this.r = Math.random() * 1.1 + .2;
      this.a = Math.random() * .12 + .025;
      this.vy = -(Math.random() * .16 + .03);
      this.vx = (Math.random() - .5) * .06;
      this.life = 0;
      this.max = Math.random() * 500 + 250;
    }
    draw() {
      this.x += this.vx;
      this.y += this.vy;
      this.life++;
      const t = this.life / this.max;
      const fade = t < .15 ? t / .15 : t > .85 ? (1 - t) / .15 : 1;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(205,187,152,${this.a * fade})`;
      ctx.fill();
      if (this.life >= this.max) this.reset();
    }
  }

  resize();
  for (let i = 0; i < 80; i++) particles.push(new Particle());

  function loop() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => p.draw());
    requestAnimationFrame(loop);
  }
  loop();
  window.addEventListener('resize', resize);
</script>
