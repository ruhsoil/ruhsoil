  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #090706;
      --cream: #F3EEE6;
      --warm: #F7F1DE;
      --gold: #CDBB98;
      --olive: #978F66;
      --muted: rgba(243, 238, 230, .64);
      --line: rgba(151, 143, 102, .22);
    }

    html, body {
      min-height: 100%;
      background: var(--black);
      color: var(--cream);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 42%, rgba(205,187,152,.08), transparent 28%),
        radial-gradient(circle at 50% 100%, rgba(151,143,102,.08), transparent 36%),
        #090706;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.014) 1px, transparent 1px);
      background-size: 74px 74px;
      opacity: .18;
      mask-image: radial-gradient(circle at 50% 44%, black, transparent 72%);
      z-index: 0;
    }

    a { color: inherit; }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.75rem;
      background: linear-gradient(to bottom, rgba(9,7,6,.84), rgba(9,7,6,.18), transparent);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .nav-brand,
    .nav-right a {
      font-size: .66rem;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--olive);
      text-decoration: none;
      transition: color .25s ease, opacity .25s ease;
    }

    .nav-brand {
      font-size: .74rem;
      letter-spacing: .32em;
      color: var(--gold);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.35rem;
    }

    .nav-right a:hover,
    .nav-brand:hover { color: var(--warm); }

    .hero {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 5.6rem 1.5rem 4rem;
    }

    .hero-mark-wrap {
      width: min(350px, 38vw);
      max-width: 350px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin-bottom: clamp(.65rem, 2vh, 1.3rem);
      position: relative;
      opacity: 0;
      transform: scale(.91);
      filter: brightness(.25) blur(3px) saturate(.65);
      will-change: opacity, transform, filter;
    }

    .hero-mark-wrap::before {
      content: '';
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 68%, rgba(205,187,152,.34), transparent 30%),
        radial-gradient(circle at 50% 50%, rgba(151,143,102,.14), transparent 56%);
      opacity: 0;
      transform: scale(.72);
      filter: blur(18px);
      pointer-events: none;
    }

    .hero-mark-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 62%, transparent 36%, rgba(205,187,152,.1) 54%, transparent 68%);
      opacity: 0;
      transform: scale(.88);
      pointer-events: none;
    }

    .hero-mark {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 50%;
      user-select: none;
      -webkit-user-drag: none;
      position: relative;
      z-index: 1;
    }

    body.ready .hero-mark-wrap {
      animation:
        markReveal 3.1s cubic-bezier(.16,1,.3,1) forwards .15s,
        markBreathe 8s ease-in-out infinite 3.6s;
    }

    body.ready .hero-mark-wrap::before {
      animation: connectionBloom 2.9s cubic-bezier(.16,1,.3,1) forwards .25s;
    }

    body.ready .hero-mark-wrap::after {
      animation: quietRing 3.4s cubic-bezier(.16,1,.3,1) forwards .45s;
    }

    .brand {
      font-size: clamp(2.7rem, 6vw, 4.8rem);
      line-height: 1;
      font-weight: 200;
      letter-spacing: .36em;
      padding-left: .36em;
      color: var(--cream);
      opacity: 0;
      transform: translateY(18px);
    }

    .core-line {
      margin-top: 1.15rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.65rem, 3.2vw, 2.45rem);
      line-height: 1.08;
      font-weight: 300;
      color: var(--warm);
      opacity: 0;
      transform: translateY(18px);
    }

    .second-line {
      margin-top: .6rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.15rem, 2.2vw, 1.65rem);
      line-height: 1.35;
      font-weight: 300;
      font-style: italic;
      color: rgba(205,187,152,.8);
      opacity: 0;
      transform: translateY(18px);
    }

    .enter {
      display: inline-block;
      margin-top: 1.9rem;
      padding: .86rem 1.9rem;
      border: 1px solid rgba(151,143,102,.54);
      color: var(--gold);
      text-decoration: none;
      text-transform: uppercase;
      font-size: .6rem;
      letter-spacing: .28em;
      font-weight: 300;
      opacity: 0;
      transform: translateY(18px);
      transition: border-color .3s ease, color .3s ease, transform .3s ease, background .3s ease;
    }

    .enter:hover {
      border-color: var(--warm);
      color: var(--warm);
      background: rgba(243,238,230,.035);
      transform: translateY(-2px);
    }

    body.ready .brand { animation: riseUp 1.15s cubic-bezier(.22,1,.36,1) forwards 1.65s; }
    body.ready .core-line { animation: riseUp 1.15s cubic-bezier(.22,1,.36,1) forwards 2.05s; }
    body.ready .second-line { animation: riseUp 1.15s cubic-bezier(.22,1,.36,1) forwards 2.35s; }
    body.ready .enter { animation: riseUp 1s cubic-bezier(.22,1,.36,1) forwards 2.75s; }

    @keyframes markReveal {
      0% {
        opacity: 0;
        transform: scale(.91);
        filter: brightness(.25) blur(3px) saturate(.65);
      }
      54% {
        opacity: .92;
        filter: brightness(.86) blur(.6px) saturate(.92);
      }
      100% {
        opacity: 1;
        transform: scale(1);
        filter: brightness(1) blur(0) saturate(1);
      }
    }

    @keyframes connectionBloom {
      0% { opacity: 0; transform: scale(.7); filter: blur(22px); }
      55% { opacity: .74; transform: scale(1.02); filter: blur(17px); }
      100% { opacity: .18; transform: scale(1.08); filter: blur(22px); }
    }

    @keyframes quietRing {
      0% { opacity: 0; transform: scale(.78); }
      42% { opacity: .55; }
      100% { opacity: 0; transform: scale(1.12); }
    }

    @keyframes markBreathe {
      0%, 100% {
        transform: scale(1);
        filter: brightness(1) drop-shadow(0 0 8px rgba(205,187,152,.08));
      }
      50% {
        transform: scale(1.012);
        filter: brightness(1.06) drop-shadow(0 0 18px rgba(205,187,152,.16));
      }
    }

    @keyframes riseUp {
      to { opacity: 1; transform: translateY(0); }
    }


    @media (min-width: 701px) and (max-height: 820px) {
      .hero {
        justify-content: flex-start;
        padding-top: 5.8rem;
        padding-bottom: 3.2rem;
      }
      .hero-mark-wrap {
        width: min(315px, 34vw);
        margin-bottom: .65rem;
      }
      .brand {
        font-size: clamp(2.6rem, 5.2vw, 4.2rem);
      }
      .core-line {
        margin-top: .95rem;
        font-size: clamp(1.55rem, 2.8vw, 2.1rem);
      }
      .enter {
        margin-top: 1.55rem;
      }
    }

    @media (max-width: 700px) {
      nav { padding: 1.05rem 1rem; }
      .nav-brand { font-size: .66rem; letter-spacing: .24em; }
      .nav-right { gap: .85rem; }
      .nav-right a { font-size: .58rem; letter-spacing: .14em; }
      .hero { padding: 5.8rem 1.1rem 2.2rem; }
      .hero-mark-wrap { width: min(330px, 76vw); margin-bottom: .55rem; }
      .brand { font-size: clamp(2.35rem, 13vw, 4rem); letter-spacing: .23em; padding-left: .23em; }
      .core-line { margin-top: 1.2rem; font-size: clamp(1.65rem, 8vw, 2.4rem); }
      .second-line { font-size: clamp(1.08rem, 5.2vw, 1.4rem); }
      .enter { margin-top: 1.8rem; padding: .82rem 1.5rem; font-size: .55rem; letter-spacing: .22em; }
    }

    @media (max-width: 430px) {
      .nav-right { gap: .65rem; }
      .nav-right a { font-size: .54rem; letter-spacing: .1em; }
      .nav-brand { letter-spacing: .18em; }
      .hero-mark-wrap { width: min(295px, 78vw); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .hero-mark-wrap, .brand, .core-line, .second-line, .enter {
        opacity: 1;
        transform: none;
        filter: none;
      }
    }
  </style>
</head>
