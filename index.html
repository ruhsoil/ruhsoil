  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#000;color:#f3eee6;font-family:'Jost',sans-serif;font-weight:300;overflow:hidden}
    #canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.1rem 1.6rem;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .nav-brand {
      font-size: .68rem;
      letter-spacing: .34em;
      font-weight: 300;
      color: #978F66;
      text-decoration: none;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.4rem;
    }

    .nav-label,
    .nav-lang {
      font-size: .6rem;
      letter-spacing: .18em;
      color: #978F66;
      text-decoration: none;
      transition: opacity .25s;
    }

    .nav-lang:hover { opacity: .65; }

    .hero{
      height:100vh;
      height:100svh;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      text-align:center;
      position:relative;z-index:1;
      padding-top:4.5rem;
    }

    .logo-wrap{
      position:relative;
      width:min(380px,78vw);
      margin-bottom:-0.8rem;
      clip-path:inset(0 0 100% 0);
      animation:revealLogo 2.4s cubic-bezier(0.4,0,0.2,1) forwards 0.2s;
    }
    .logo-wrap img{width:100%;display:block;mix-blend-mode:screen}
    .logo-wrap::after{
      content:'';
      position:absolute;inset:0;
      background:linear-gradient(to bottom, #F7F1DE 0%, #B0BA99 50%, #9D6638 100%);
      mix-blend-mode:multiply;
      pointer-events:none;
    }

    @keyframes revealLogo{
      0%   {clip-path:inset(0 0 100% 0)}
      100% {clip-path:inset(0 0 0% 0)}
    }
    @keyframes riseUp{
      from{opacity:0;transform:translateY(22px)}
      to  {opacity:1;transform:translateY(0)}
    }

    .brand{
      font-family:'Jost',sans-serif;font-weight:200;
      font-size:clamp(4rem,9vw,6.5rem);
      letter-spacing:.35em;line-height:1;
      background:linear-gradient(to bottom, #9D6638 0%, #B0BA99 50%, #F7F1DE 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      opacity:0;animation:riseUp 1.4s cubic-bezier(0.22,1,0.36,1) forwards 1.6s;
    }
    .kicker{
      margin-top:1.1rem;font-size:.52rem;letter-spacing:.28em;text-transform:uppercase;
      color:#aba7a2;
      opacity:0;animation:riseUp 1.2s cubic-bezier(0.22,1,0.36,1) forwards 2s;
    }
    .tagline{
      margin-top:.5rem;
      font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;
      font-size:clamp(1.8rem,3.5vw,2.6rem);
      color:#CDBB98;
      opacity:0;animation:riseUp 1.2s cubic-bezier(0.22,1,0.36,1) forwards 2.3s;
    }
    .enter{
      display:inline-block;margin-top:2.2rem;
      text-decoration:none;border:1px solid #9D6638;
      padding:.9rem 2rem;
      font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;
      font-weight:400;
      color:#cdbb98;
      opacity:0;animation:riseUp 1s cubic-bezier(0.22,1,0.36,1) forwards 2.6s;
      transition:border-color .3s,color .3s,transform .3s;
    }
    .enter:hover{border-color:#F7F1DE;color:#f3eee6;transform:translateY(-2px)}

    @media (max-width: 640px) {
      nav {
        padding: .95rem 1rem;
      }
      .nav-brand {
        font-size: .58rem;
        letter-spacing: .24em;
      }
      .nav-right {
        gap: .85rem;
      }
      .nav-label,
      .nav-lang {
        font-size: .56rem;
        letter-spacing: .14em;
      }
      .hero{
        padding:4.8rem 1.15rem 2.2rem;
      }
      .logo-wrap{
        width:min(320px,74vw);
        margin-bottom:-0.55rem;
      }
      .brand{
        font-size:clamp(2.7rem,16vw,4.4rem);
        letter-spacing:.22em;
        padding-left:.22em;
      }
      .kicker{
        margin-top:.9rem;
        font-size:.48rem;
        letter-spacing:.22em;
      }
      .tagline{
        font-size:clamp(1.45rem,8vw,2rem);
      }
      .enter{
        margin-top:1.8rem;
        padding:.82rem 1.55rem;
        font-size:.56rem;
        letter-spacing:.22em;
      }
    }

    @media (max-width: 380px) {
      .nav-brand {
        letter-spacing: .2em;
      }
      .nav-right {
        gap: .65rem;
      }
      .nav-label,
      .nav-lang {
        letter-spacing: .1em;
      }
      .brand{
        font-size:clamp(2.35rem,15vw,3.7rem);
        letter-spacing:.18em;
        padding-left:.18em;
      }
      .logo-wrap{
        width:min(285px,72vw);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .logo-wrap { clip-path: inset(0 0 0 0); }
      .brand, .kicker, .tagline, .enter { opacity: 1; transform: none; }
    }

  </style>

  <h1 class="brand">RUHSOIL</h1>
  <p class="kicker">Cinematics without borders.</p>
  <p class="tagline">Everything is connected.</p>
  <a class="enter" href="about.html">Enter</a>
</main>
<script>
  const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
  let W,H,particles=[];
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
  class Particle{
    constructor(){this.reset(true)}
    reset(init=false){
      this.x=Math.random()*W;this.y=init?Math.random()*H:H+10;
      this.r=Math.random()*1.1+.2;this.a=Math.random()*.12+.025;
      this.vy=-(Math.random()*.16+.03);this.vx=(Math.random()-.5)*.06;
      this.life=0;this.max=Math.random()*500+250;
    }
    draw(){
      this.x+=this.vx;this.y+=this.vy;this.life++;
      const t=this.life/this.max,fade=t<.15?t/.15:t>.85?(1-t)/.15:1;
      ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(205,187,152,${this.a*fade})`;ctx.fill();
      if(this.life>=this.max)this.reset();
    }
  }
  resize();
  for(let i=0;i<80;i++)particles.push(new Particle());
  function loop(){ctx.clearRect(0,0,W,H);particles.forEach(p=>p.draw());requestAnimationFrame(loop)}
  loop();
  window.addEventListener('resize',resize);
</script>
